name: Fetch source covers (temporary)

on:
  push:
    paths:
      - '.github/workflows/fetch-covers.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Download and downscale covers
        run: |
          python3 -m pip install --quiet pillow
          SUPABASE_URL="https://vycvmsqjseeiiotjjbep.supabase.co" python3 - <<'PY'
          import os, io, urllib.parse, urllib.request
          from PIL import Image

          base = os.environ["SUPABASE_URL"]
          bucket = "Red POly Website"
          names = [
              "IMG20261118095135.jpg",
              "IMG20261118094846.jpg",
              "IMG20261118095016.jpg",
              "IMG20261118095039.jpg",
          ]
          out_dir = ".source-covers"
          os.makedirs(out_dir, exist_ok=True)
          for name in names:
              url = f"{base}/storage/v1/object/public/{urllib.parse.quote(bucket)}/{urllib.parse.quote(name)}"
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              image = Image.open(io.BytesIO(data)).convert("RGB")
              width, height = image.size
              scale = min(1.0, 1000.0 / max(width, height))
              if scale < 1.0:
                  image = image.resize((round(width * scale), round(height * scale)), Image.LANCZOS)
              image.save(os.path.join(out_dir, name), "JPEG", quality=82, optimize=True)
              print(f"ok {name} orig={width}x{height} saved={image.size}")
          PY

      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .source-covers
          git diff --cached --quiet || git commit -m "Add source covers for orientation fix"
          git push || true
